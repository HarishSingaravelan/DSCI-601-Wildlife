  # use_light_augmentation: true


# Option 1: ADAPTIVE SAMPLER (Recommended for medium-large datasets)
  # Learns optimal class weights from validation performance
  # Starts with initial_mode, then adapts based on per-class AP
  use_adaptive_sampler: false

  # Adaptive sampler settings (only used if use_adaptive_sampler: true)
  initial_mode: 'equal'         # Start mode: 'equal', 'sqrt', or 'log'
  adaptation_rate: 0.3          # How fast to adapt (0.1=slow, 0.5=fast)
  min_weight: 0.02              # <-- Changed to 0.02 (Maintenance dose)
  max_weight: 5.0               # Maximum weight for any class
  
  # --- NEW BACKGROUND SETTINGS ---
  background_ratio: 0.20        # Initial background ratio (0.5 = 50%)
  dynamic_background: false      # Automatically adjust BG ratio based on validation
  min_bg_ratio: 0.02            # Never drop below 15% background
  max_bg_ratio: 0.50            # Never exceed 50% background
  
  # # Adaptive sampler settings (only used if use_adaptive_sampler: true)
  # initial_mode: 'equal'         # Start mode: 'equal', 'sqrt', or 'log'
  # adaptation_rate: 0.3          # How fast to adapt (0.1=slow, 0.5=fast)
  # min_weight: 0.1               # Minimum weight for any class (prevents starvation)
  # max_weight: 5.0               # Maximum weight for any class (prevents domination)
  
  # # Option 2: BALANCED SAMPLER (Recommended for small datasets)
  # Fixed balancing strategy, doesn't adapt over time
  use_balanced_sampler: false
  
  # Balanced sampler settings (only used if use_balanced_sampler: true)
  balance_mode: 'log'           # Options: 'equal', 'sqrt', 'log'
                                # 'equal' = all classes get same samples (high repetition)
                                # 'sqrt'  = sqrt-weighted (moderate repetition)
                                # 'log'   = log-weighted (low repetition, best for tiny datasets)



  
  # Option 3: No sampler (use_adaptive_sampler: false, use_balanced_sampler: false)
  # Regular random shuffling with natural class distribution


