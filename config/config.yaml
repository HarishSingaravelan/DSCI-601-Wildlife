# config/config.yaml
# DETR configuration for turbine_split_all_classes dataset (55 species)

training:
  num_epochs: 400              
  batch_size: 4 # 4 for defomable 
  num_workers: 0 # 34 on A100 0 for local testing
  learning_rate: 0.0001       
  weight_decay: 0.0001
  # Learning rate scheduler
  scheduler_step_size: 200       # Reduce LR every N epochs 
  scheduler_gamma: 0.1          # LR = LR * gamma
  
  # Early stopping
  patience: 50   # Stop if no improvement for N evaluations
  
  device: "cuda"
  output_model_path: "standard_detr_model.pth"

  # Evaluation
  eval_every_n_epochs: 5      # Evaluate less frequently (dataset is larger)
  save_best_model: true
  

  # Checkpointing
  checkpoint_dir: "checkpoints/standard_detr/"
  save_checkpoint_every: 10

  # Resume from checkpoint
  resume_checkpoint: null # set null if starting fresh

evaluation:
  compute_pr_curve: true
  compute_confusion_matrix: true
  confidence_threshold: 0.1   
  iou_threshold: 0.5
  save_plots: true
  plots_dir: "metrics/evaluation_plots_standard_detr/"
  show_plots: false

data:
  train_images_dir: "."
  train_ann_file: "turbine_split/train/annotations.json"

  val_images_dir: "."
  val_ann_file: "turbine_split/val/annotations.json"

  test_images_dir: "."
  test_ann_file: "turbine_split/test/annotations.json"



